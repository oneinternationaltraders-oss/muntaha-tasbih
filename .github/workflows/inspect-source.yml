name: Inspect recovered app source
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source snippets
        run: |
          python - <<'PY'
          import base64,gzip
          from pathlib import Path
          raw=Path('recovery/packed.concat.txt').read_text().strip()
          html=gzip.decompress(base64.b64decode(raw)).decode('utf-8','replace')
          print('HTML_LENGTH',len(html))
          for key in ['pcStartDate','pcSaveStart','prayerCalendarPanel','qaza-grid','const START','localStorage.getItem(START)']:
              print('\\n===== '+key+' =====')
              start=0; count=0
              while True:
                  i=html.find(key,start)
                  if i<0 or count>=4: break
                  print(html[max(0,i-700):i+1800])
                  start=i+len(key); count+=1
          PY
