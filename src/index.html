<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#064e3b"><title>منتہیٰ تسبیح و وظائف</title><link rel="manifest" href="/manifest.webmanifest"></head><body style="margin:0;background:#061b16;color:white;font-family:system-ui"><div id="load" style="padding:24px;text-align:center">ایپ لوڈ ہو رہی ہے…</div><script>(async()=>{try{const {patchHtml}=await import('/patch.js?v=41');let b='';for(let i=0;i<64;i++){const r=await fetch('/packed'+i+'.txt?v=40',{cache:'no-store'});if(!r.ok)throw Error('فائل '+i+' نہیں ملی ('+r.status+')');b+=(await r.text()).trim()}const bin=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));let html=await new Response(stream).text();html=patchHtml(html);if(!html.includes('<!doctype html')||!html.includes('</html>'))throw Error('ایپ فائل نامکمل ہے');document.open();document.write(html);document.close()}catch(e){document.getElementById('load').textContent='ایپ لوڈ نہیں ہو سکی: '+(e.message||e);console.error(e)}})();</script></body></html>
